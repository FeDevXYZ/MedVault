name: Build release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the files to (e.g. v1.1-alpha)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: MedVault
            file: MedVault.exe
          - os: ubuntu-22.04
            name: MedVault-linux
            file: MedVault-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build
        env:
          APP_NAME: ${{ matrix.name }}
        run: uv run --python 3.14 --with pyinstaller pyinstaller MedVault.spec

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "dist/${{ matrix.file }}" --clobber
